<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    
    <!-- Подключение SDK Яндекс Игр -->
    <script src="/sdk.js"></script>
  </head>
  <body style="margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000;">
    <!-- Полноэкранный холст -->
    <canvas id="unity-canvas" tabindex="-1" style="width: 100% !important; height: 100% !important; position: fixed; left: 0; top: 0; background: #231F20"></canvas>
    
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        
        // ИСПРАВЛЕНО НАЙДЕНО: Берем первый элемент [0] из массива head, теперь без ошибок!
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      });
    </script>
  </body>
</html>
